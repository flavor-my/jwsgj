[pytest]
# Regression defaults（20261116 内存阈值收敛）：
# -n 4（原 `-n auto`）: xdist 每个 worker 都要**全量收集** 82662 个用例、
#   导入 264 个测试模块 + 全量治理包模块，单 worker 收集后常驻 RSS 约
#   730MB（实测）。`-n auto` 在本机 20 核上铺 20 个 worker，仅收集基线
#   就 20×730MB≈14.6GB，超出 15.7GB 物理内存（可用仅 5.8GB）→ 换页
#   抖动 / worker 被 OOM 重启，进程数反而翻倍。实测同一文件 `-n 20`
#   峰值 2855MB/26 进程、`-n 4` 峰值 973MB/9 进程且墙钟更快（58.8s→
#   37.9s）：超过内存带宽后继续加 worker 只增内存不增吞吐。
#   4 个 worker 的收集基线≈2.9GB，留足运行期增长（单 worker 峰值可达
#   1-3GB）后的安全余量。
#   DEBUG ESCAPE HATCH: 串行调试用 `-n 0`（跳过 worker 启动，单用例更快）；
#   内存充裕的机器可用命令行 `-n 8` 覆盖本行（CLI 后置，优先级更高）。
# --dist loadscope: group tests per module to one worker: keeps timing-sensitive
#   suites (xv_phase_prevalidate dead-code fallback / cached result assertions) in serial
#   semantics under parallel runs.
# --reruns 1: retry each failed test once: zero cost on green runs, absorbs
#   residual occasional failures under full-load parallelism. Real regressions
#   still fail (rerun does not mask a deterministic failure).
# -p no:cacheprovider: pytest 默认把 .pytest_cache 写到 rootdir（技能根），
#   属于运行态污染；Temp 治理契约要求产物只落会话工作空间，故整体禁用
#   缓存 provider（--lf/--ff 随之不可用，需要时用 -k 定向选取）。
# pythonpath = ..: 把技能根目录的父目录加入 sys.path，使 `import jwsgj`
# 不依赖启动 cwd（rootdir 为技能根，故 `..` 即父目录）。
pythonpath = ..
addopts = -n 4 --dist loadscope --reruns 1 -p no:cacheprovider

markers =
    real_template_meta_path: 跳过模板统计路径隔离，断言模块导入期的真实默认落点
